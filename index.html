    <script>
      // In sandbox/iframe preview environments where HMR WebSockets are disabled/closed by proxy,
      // shim the Vite HMR WebSocket so it resolves cleanly without emitting unhandled rejection errors.
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            if (protocols) {
              if (Array.isArray(protocols)) {
                isHmr = protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1;
              } else if (typeof protocols === 'string') {
                isHmr = protocols === 'vite-hmr' || protocols === 'vite-ping';
              }
            }
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            }
            if (isHmr) {
              var target = document.createElement('div');
              var ws = {
                readyState: 1,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                  if (type === 'open') {
                    setTimeout(function() {
                      target.dispatchEvent(new Event('open'));
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                }
              };
              setTimeout(function() {
                if (typeof ws.onopen === 'function') ws.onopen(new Event('open'));
              }, 0);
              return ws;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var r = event && event.reason;
          var msg = (r && (r.message || r.stack || String(r))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
