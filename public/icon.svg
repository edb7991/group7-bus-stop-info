<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Outer Ring Indicator -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />

  <!-- Bus Body Graphic -->
  <g transform="translate(116, 126)">
    <!-- Bus Roof / Top Shell -->
    <rect x="0" y="20" width="280" height="200" rx="36" fill="url(#shield)" />
    
    <!-- Windshield / Top Deck Window -->
    <rect x="22" y="42" width="236" height="60" rx="16" fill="#0f172a" />
    <!-- Destination Sign -->
    <rect x="65" y="48" width="150" height="20" rx="6" fill="#020617" />
    <text x="140" y="62" fill="#fbbf24" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle" letter-spacing="2">SMU TRANSIT</text>

    <!-- Lower Windshield -->
    <rect x="22" y="114" width="236" height="48" rx="12" fill="#0f172a" />

    <!-- Headlights -->
    <circle cx="48" cy="186" r="14" fill="url(#accent)" />
    <circle cx="232" cy="186" r="14" fill="url(#accent)" />
    <!-- Radiator Grille -->
    <rect x="100" y="180" width="80" height="12" rx="4" fill="#1e293b" />

    <!-- Wheels -->
    <rect x="36" y="210" width="46" height="30" rx="10" fill="#020617" />
    <rect x="198" y="210" width="46" height="30" rx="10" fill="#020617" />
  </g>

  <!-- Fast Hustle Indicator / Sprint Badge -->
  <g transform="translate(320, 310)">
    <circle cx="36" cy="36" r="42" fill="#f59e0b" />
    <polygon points="40,16 22,42 34,42 32,58 50,32 38,32" fill="#0f172a" />
  </g>

  <!-- Title Mark -->
  <text x="256" y="430" fill="#ffffff" font-size="34" font-weight="800" font-family="-apple-system, system-ui, sans-serif" text-anchor="middle" letter-spacing="1">SMU BUS</text>
  <text x="256" y="460" fill="#94a3b8" font-size="16" font-weight="600" font-family="monospace" text-anchor="middle" letter-spacing="3">LOBBY &amp; RUN</text>
</svg>
